name: Playwright & Cucumber Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:   # Allows manual trigger from GitHub UI

jobs:
  playwright-tests:
    name: Playwright Tests (Chromium + Edge)
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium msedge

      - name: Run Playwright tests (Chromium)
        run: npx playwright test --project=chromium
        continue-on-error: true

      - name: Run Playwright tests (Edge)
        run: npx playwright test --project=edge
        continue-on-error: true

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results (traces & screenshots)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  cucumber-tests:
    name: Cucumber BDD Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (for Cucumber hooks)
        run: npx playwright install --with-deps chromium

      - name: Run all Cucumber tests
        run: npm run test:cucumber

      - name: Run Cucumber Regression tests
        run: npm run test:regression
        continue-on-error: true

      - name: Run Cucumber Validation tests
        run: npm run test:validation
        continue-on-error: true

      - name: Upload Cucumber HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cucumber-html-report
          path: cucumber-report.html
          retention-days: 30
